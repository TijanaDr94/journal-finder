services:
  journal-finder:
    build: .
    image: journal-finder:latest
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SCORING_MODE=${SCORING_MODE:-hybrid}
      - HYBRID_ALPHA=${HYBRID_ALPHA:-0.3}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}